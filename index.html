<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DASH — Digital Assistant for Smart & Honest Voting. Smart election guidance for Indian voters."
    />
    <title>DASH — Smart Voting Guide</title>
    <script>
      (function () {
        try {
          var k = 'dash-theme'
          var t = localStorage.getItem(k)
          var root = document.documentElement
          if (t === 'dark') root.classList.add('dark')
          else if (t === 'light') root.classList.remove('dark')
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) root.classList.add('dark')
          else root.classList.remove('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
